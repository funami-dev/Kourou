<div class="game-clock" role="group" aria-label="Spieluhr" i18n-aria-label="@@gameClock.label">
  <span class="game-clock__time" [class.game-clock__time--paused]="isPaused()">
    {{ gameTimeMs() | gameDateTime }}
  </span>

  <button mat-icon-button type="button" [attr.aria-label]="pauseButtonLabel()" (click)="togglePause()">
    <mat-icon>{{ isPaused() ? 'play_arrow' : 'pause' }}</mat-icon>
  </button>

  @for (gameSpeed of gameSpeeds; track gameSpeed) {
    <button
      mat-button
      type="button"
      class="game-clock__speed"
      [class.game-clock__speed--active]="gameSpeed === speed()"
      [attr.aria-pressed]="gameSpeed === speed()"
      [attr.aria-label]="speedButtonLabel(gameSpeed)"
      (click)="changeSpeed(gameSpeed)"
    >
      {{ gameSpeed }}×
    </button>
  }
</div>
